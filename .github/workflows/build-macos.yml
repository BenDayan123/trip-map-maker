name: Build macOS app

# Builds the Apple Silicon .dmg (TripMapMaker-macos-arm64.dmg).
# Run by hand (Actions -> Run workflow), or push a v* tag to also publish the
# .dmg to a GitHub Release.
#
# No Mac needed to build -- it all runs in CI.
#
# Apple Silicon only, on purpose: the admins run Apple Silicon Macs. The old
# Intel leg cross-built under Rosetta and lipo-merged a universal .app, which
# doubled the build, doubled the ~150MB bundled browser, and shipped an arm64
# browser inside the Intel app (Playwright's universal2 node detects the *host*
# arch, not the target). None of that is worth carrying for machines nobody uses.
# To bring Intel back, add a job on an x86_64 runner -- do not cross-build.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for the release step on tags

jobs:
  build:
    runs-on: macos-14 # Apple Silicon
    name: build (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the .app
        run: |
          chmod +x build_app.sh
          ./build_app.sh # ad-hoc signs; fails if the bundled browser won't launch

      - name: Verify the app is arm64
        run: |
          BIN="dist/My Maps Generator.app/Contents/MacOS/My Maps Generator"
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs: $ARCHS"
          case "$ARCHS" in *arm64*) ;; *) echo "::error::app is not arm64 ($ARCHS)"; exit 1;; esac

      # build_app.sh already fails the build if the bundled Chromium can't be
      # launched. This adds the other half: the frozen app boots Streamlit and
      # reaps the child. It does NOT cover the window itself (no webview here),
      # so a pywebview/Cocoa regression still needs a real Mac to catch.
      - name: Smoke-test the .app (boots Streamlit in the bundle, then shuts down)
        timeout-minutes: 5
        run: '"dist/My Maps Generator.app/Contents/MacOS/My Maps Generator" --selfcheck'

      - name: Package the .dmg
        run: |
          chmod +x build_dmg.sh
          ./build_dmg.sh
          mv TripMapMaker.dmg "TripMapMaker-macos-arm64.dmg"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: TripMapMaker-macos-arm64
          path: TripMapMaker-macos-arm64.dmg
          if-no-files-found: error

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TripMapMaker-macos-arm64.dmg
