name: Build macOS app

# Builds a UNIVERSAL2 TripMapMaker.app + .dmg (runs natively on Intel AND Apple
# Silicon). Run by hand (Actions -> Run workflow), or push a v* tag to also
# publish the .dmg to a GitHub Release.
#
# PyInstaller can't emit universal2 directly here (numpy/pyarrow ship arch-only
# wheels, no fat wheel to bundle). So we build the app natively on each arch and
# lipo them together in the `merge` job — see merge_universal.sh. The Intel leg
# needs the macos-13 runner; if it can't allocate, the merge fails and you fall
# back to the per-arch artifacts this workflow still uploads.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed for the release step on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            arch: arm64
          - runner: macos-13 # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the native .app
        run: |
          chmod +x build_app.sh
          ./build_app.sh   # native arch; ad-hoc signs (re-signed after merge)

      - name: Tar the .app (preserve perms/symlinks for the merge job)
        run: tar -czpf "app-${{ matrix.arch }}.tar.gz" -C dist "My Maps Generator.app"

      - name: Upload the native .app
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: app-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  merge:
    needs: build
    runs-on: macos-14
    name: merge universal + package
    steps:
      - uses: actions/checkout@v4

      - name: Download both native builds
        uses: actions/download-artifact@v4
        with:
          path: apps

      - name: Unpack the native .app bundles
        run: |
          mkdir -p arm64 x86_64
          tar -xzpf apps/app-arm64/app-arm64.tar.gz -C arm64
          tar -xzpf apps/app-x86_64/app-x86_64.tar.gz -C x86_64

      - name: Merge into a universal .app
        run: |
          chmod +x merge_universal.sh build_dmg.sh
          mkdir -p dist
          ./merge_universal.sh \
            "arm64/My Maps Generator.app" \
            "x86_64/My Maps Generator.app" \
            "dist/My Maps Generator.app"

      - name: Package the .dmg
        run: |
          ./build_dmg.sh
          mv TripMapMaker.dmg "TripMapMaker-macos-universal.dmg"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: TripMapMaker-macos-universal
          path: TripMapMaker-macos-universal.dmg
          if-no-files-found: error

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TripMapMaker-macos-universal.dmg
